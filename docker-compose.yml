# One command to run the whole system:   docker compose up --build
#   UI:      http://localhost:5173
#   API docs http://localhost:8000/docs      health + storage backend: http://localhost:8000/health
#
# Services: db (PostgreSQL 16, data kept in the `pgdata` volume), backend (FastAPI), frontend (nginx).
# The backend stores analysis runs in PostgreSQL because DATABASE_URL is set below. To run WITHOUT a database (in-memory,
# results lost on restart) start only the app:   docker compose up --build backend frontend   with DATABASE_URL emptied
# (set DATABASE_URL= in a .env file), or run the backend directly as described in README.md.
#
# STATUS: the PostgreSQL storage code is tested against a real PostgreSQL server (tests/test_postgres_store.py), and this file's structure is
# validated by tests/test_docker_files.py. The containers themselves have NOT been run by the author (no Docker where this was written).
# Run scripts/docker_smoke.sh after `docker compose up -d --build` to check them; if something fails, the error points at one of the files below.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arch_dev_password}   # development default; set POSTGRES_PASSWORD in a .env file for anything else
      POSTGRES_DB: arch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arch -d arch"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./datasets:/app/datasets        # repositories to analyse (the UI's default paths resolve here)
      - ./results:/app/results          # experiment outputs shown on the Evaluation page
    environment:
      DATABASE_URL: postgresql://arch:${POSTGRES_PASSWORD:-arch_dev_password}@db:5432/arch
      # Optional LLM for semantic analysis. Without these the UI explains how to configure one.
      # Ollama on the host:  LLM_BASE_URL=http://host.docker.internal:11434/v1
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CACHE_PATH: /app/results/llm_cache.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach Ollama running on the host
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:

# One command to run the whole system:   docker compose up --build
#   UI:      http://localhost:5173
#   API docs http://localhost:8000/docs
#
# STATUS: written but NOT tested by its author (no Docker available where it was written).
# If something fails, the error will point at one of the three files below.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./datasets:/app/datasets        # repositories to analyse (the UI's default paths resolve here)
      - ./results:/app/results          # experiment outputs shown on the Evaluation page
    environment:
      # Optional LLM for semantic analysis. Without these the UI explains how to configure one.
      # Ollama on the host:  LLM_BASE_URL=http://host.docker.internal:11434/v1
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CACHE_PATH: /app/results/llm_cache.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach Ollama running on the host
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"
